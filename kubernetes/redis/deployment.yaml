# orgchart-redis-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orgchart-redis
  labels:
    app: orgchart-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orgchart-redis
  template:
    metadata:
      labels:
        app: orgchart-redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-persistent-storage
              mountPath: /data
      volumes:
        - name: redis-persistent-storage
          persistentVolumeClaim:
            claimName: redis-pv-claim