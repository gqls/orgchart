services:
  app:
    build:
      context: ./docker/app
    volumes:
      - .:/var/www/html
    networks:
      - orgcharts-network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - orgcharts-network
    depends_on:
      - app

  node:
    build:
      context: ./docker/node
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173" # For Vite HMR
    networks:
      - orgcharts-network
    tty: true
    stdin_open: true
    depends_on:
      - app
    # Make sure node_modules permissions are set correctly
    # on prod use node user
    user: "root"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # For better file watching in Docker

  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sh:/docker-entrypoint-initdb.d/init-testing-db.sh
    networks:
      - orgcharts-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - orgcharts-network

networks:
  orgcharts-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  node_modules:
    driver: local